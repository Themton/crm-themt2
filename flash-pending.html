<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แจ้งเตือน: แฟลชยังไม่รับเข้าระบบ — THE MT</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b;
    --accent:#d97706; --red:#dc2626; --redbg:#fef2f2; --amber:#d97706; --amberbg:#fffbeb;
    --gray:#64748b; --graybg:#f8fafc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;padding:14px;-webkit-text-size-adjust:100%}
  .wrap{max-width:1100px;margin:0 auto}
  header{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .htop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .countbox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
  .bignum{font-size:34px;font-weight:800;color:var(--red);line-height:1}
  .bignum.zero{color:#16a34a}
  .countlabel{font-size:13px;color:var(--muted)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
  input.search{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit}
  button{padding:10px 16px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;display:inline-flex;align-items:center;gap:6px}
  button:disabled{opacity:.6;cursor:default}
  .updated{font-size:12px;color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:8px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    display:grid;grid-template-columns:1.3fr 1.5fr 1fr 1fr auto;gap:10px;align-items:center}
  .row.old{border-left:4px solid var(--red)}
  .row.mid{border-left:4px solid var(--amber)}
  .tn{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px;letter-spacing:.3px;word-break:break-all}
  .cust{font-weight:600;font-size:14px}
  .ph{color:var(--muted);font-size:12px}
  .tele{font-size:13px}
  .tele .lbl{color:var(--muted);font-size:11px;display:block}
  .date{font-size:12px;color:var(--muted)}
  .wait{font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap;text-align:center}
  .wait.old{color:var(--red);background:var(--redbg)}
  .wait.mid{color:var(--amber);background:var(--amberbg)}
  .wait.new{color:var(--gray);background:var(--graybg)}
  .head-row{display:grid;grid-template-columns:1.3fr 1.5fr 1fr 1fr auto;gap:10px;padding:0 14px;
    font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
  .state{text-align:center;padding:50px 20px;color:var(--muted);font-size:15px}
  .state .big{font-size:40px;margin-bottom:8px}
  .err{background:var(--redbg);color:var(--red);border:1px solid #fecaca;border-radius:12px;padding:14px;font-size:14px}
  .legend{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  @media(max-width:720px){
    .head-row{display:none}
    .row{grid-template-columns:1fr 1fr;gap:6px}
    .row .tn{grid-column:1/2}
    .row .wait{grid-column:2/3;justify-self:end}
    .row .cust{grid-column:1/3}
    .row .tele{grid-column:1/2}
    .row .date{grid-column:2/3;justify-self:end}
    h1{font-size:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="htop">
      <div>
        <h1>📦 พัสดุที่แฟลชยังไม่รับเข้าระบบ</h1>
        <div class="sub">สร้างเลขพัสดุแล้ว แต่ Flash ยังไม่สแกนรับ — ตรวจสอบว่าได้ส่งของจริงหรือยัง</div>
      </div>
      <button id="refreshBtn" onclick="load()">🔄 รีเฟรช</button>
    </div>
    <div class="countbox">
      <div class="bignum" id="count">–</div>
      <div class="countlabel">รายการที่ต้องตามเก็บ<br><span class="updated" id="updated"></span></div>
    </div>
    <div class="controls">
      <input class="search" id="search" placeholder="🔍 ค้นหา เลขพัสดุ / ชื่อลูกค้า / เบอร์ / พนักงาน..." oninput="render()">
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#dc2626"></span>ค้างเกิน 2 วัน</span>
      <span><span class="dot" style="background:#d97706"></span>ค้าง 1–2 วัน</span>
      <span><span class="dot" style="background:#cbd5e1"></span>น้อยกว่า 1 วัน</span>
    </div>
  </header>

  <div class="head-row">
    <div>เลขพัสดุ</div><div>ลูกค้า</div><div>พนักงาน</div><div>วันที่สร้าง</div><div>ค้างมา</div>
  </div>
  <div class="list" id="list">
    <div class="state"><div class="big">⏳</div>กำลังโหลด...</div>
  </div>
</div>

<script>
  const SB_URL = "https://sfwbzcrvesbeymvlsxsu.supabase.co";
  const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNmd2J6Y3J2ZXNiZXltdmxzeHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNTMzNTgsImV4cCI6MjA4ODkyOTM1OH0.E4Zvq43f0M29hAZzKg78W9HRpthv0I9U37LDo_0Pyvo";
  const STATUS = "สร้างรายการ"; // สร้างเลขแล้วแต่แฟลชยังไม่รับเข้าระบบ

  let DATA = [];

  function fmtWait(createdAt){
    if(!createdAt) return {txt:"-", cls:"new", ms:0};
    const ms = Date.now() - new Date(createdAt).getTime();
    if(isNaN(ms)) return {txt:"-", cls:"new", ms:0};
    const days = Math.floor(ms/86400000);
    const hrs = Math.floor((ms%86400000)/3600000);
    let txt = days>0 ? (days+" วัน "+hrs+" ชม.") : (hrs>0 ? (hrs+" ชม.") : "เพิ่งสร้าง");
    let cls = days>=2 ? "old" : (days>=1 ? "mid" : "new");
    return {txt, cls, ms};
  }
  function fmtDate(s){
    if(!s) return "-";
    try{ const d=new Date(s); if(!isNaN(d)) return d.toLocaleDateString("th-TH",{day:"2-digit",month:"short",timeZone:"Asia/Bangkok"})+" "+d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Bangkok"}); }catch(e){}
    return String(s).substring(0,16);
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  async function load(){
    const btn=document.getElementById("refreshBtn");
    btn.disabled=true; btn.textContent="⏳ กำลังโหลด...";
    try{
      const q = SB_URL+"/rest/v1/parcel_checks?select=tracking_no,customer_name,phone,telesale,date,created_at"
        + "&flash_status=eq."+encodeURIComponent(STATUS)
        + "&tracking_no=like.TH*&order=created_at.asc";
      const res = await fetch(q,{ headers:{ apikey:SB_KEY, Authorization:"Bearer "+SB_KEY, Prefer:"count=exact", Range:"0-4999" } });
      if(!res.ok) throw new Error("HTTP "+res.status);
      DATA = await res.json();
      const cr = res.headers.get("content-range")||"";
      const total = cr.includes("/") ? cr.split("/")[1] : DATA.length;
      document.getElementById("count").textContent = total;
      document.getElementById("count").classList.toggle("zero", Number(total)===0);
      const now=new Date();
      document.getElementById("updated").textContent = "อัปเดตล่าสุด "+now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
      render();
    }catch(e){
      document.getElementById("list").innerHTML = '<div class="err">โหลดข้อมูลไม่สำเร็จ: '+esc(e.message)+'<br>ลองรีเฟรชอีกครั้ง</div>';
      document.getElementById("count").textContent="!";
    }
    btn.disabled=false; btn.textContent="🔄 รีเฟรช";
  }

  function render(){
    const term=(document.getElementById("search").value||"").trim().toLowerCase();
    let rows = DATA;
    if(term){
      rows = rows.filter(r => [r.tracking_no,r.customer_name,r.phone,r.telesale].some(v=>String(v||"").toLowerCase().includes(term)));
    }
    const list=document.getElementById("list");
    if(rows.length===0){
      list.innerHTML = term
        ? '<div class="state"><div class="big">🔍</div>ไม่พบรายการที่ค้นหา</div>'
        : '<div class="state"><div class="big">🎉</div>ไม่มีพัสดุค้าง — แฟลชรับเข้าระบบครบแล้ว</div>';
      return;
    }
    list.innerHTML = rows.map(r=>{
      const w=fmtWait(r.created_at);
      return '<div class="row '+w.cls+'">'
        + '<div class="tn">'+esc(r.tracking_no)+'</div>'
        + '<div class="cust">'+esc(r.customer_name||"-")+'<div class="ph">'+esc(r.phone||"")+'</div></div>'
        + '<div class="tele"><span class="lbl">พนักงาน</span>'+esc(r.telesale||"-")+'</div>'
        + '<div class="date">'+fmtDate(r.created_at||r.date)+'</div>'
        + '<div class="wait '+w.cls+'">'+w.txt+'</div>'
        + '</div>';
    }).join("");
  }

  load();
  setInterval(load, 120000); // auto-refresh ทุก 2 นาที
</script>
</body>
</html>
